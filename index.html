<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>ITU Equipos - Sistema de Gestión</title>
    <meta name="description" content="Sistema integral de inventario, control, asignación y mantenimiento de equipos ITU." />
    <meta property="og:title" content="ITU Equipos - Sistema de Gestión" />
    <meta property="og:description" content="Sistema integral de inventario, control, asignación y mantenimiento de equipos ITU." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          localStorage.removeItem('itu-equipos-theme');
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          else root.classList.remove('dark');
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
